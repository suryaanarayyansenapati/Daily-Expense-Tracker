
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Daily Expense Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #202438;
        }
        .card {
            width: 100%;
            max-width: 410px;
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,.08);
        }
        h1 { margin: 0 0 8px; font-size: 25px; }
        .sub { color: #6b7280; margin: 0 0 24px; line-height: 1.5; }
        label { display: block; margin: 16px 0 7px; font-weight: 600; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7dbe5;
            border-radius: 9px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: 0;
            border-radius: 9px;
            background: #8b0d1a;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .switch {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        .switch button {
            width: auto;
            margin: 0;
            padding: 0;
            background: transparent;
            color: #8b0d1a;
        }
        #message { margin-top: 16px; font-size: 14px; line-height: 1.5; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <main class="card">
        <h1 id="heading">Welcome back</h1>
        <p class="sub" id="subtitle">Log in to track your daily spending.</p>

        <form id="authForm">
            <div id="usernameField" class="hidden">
                <label for="username">Username</label>
                <input id="username" name="username" minlength="3" maxlength="40"
                       autocomplete="username">
            </div>

            <div id="emailField" class="hidden">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" maxlength="254"
                       autocomplete="email">
            </div>

            <div id="identityField">
                <label for="identity">Username or email</label>
                <input id="identity" name="identity" autocomplete="username">
            </div>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="10" maxlength="128" required
                   autocomplete="current-password">

            <button type="submit" id="submitButton">Log in</button>
        </form>

        <div class="switch">
            <span id="switchText">New here?</span>
            <button type="button" id="switchButton">Create account</button>
        </div>
        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script>
        const form = document.getElementById("authForm");
        const usernameField = document.getElementById("usernameField");
        const emailField = document.getElementById("emailField");
        const identityField = document.getElementById("identityField");
        const username = document.getElementById("username");
        const email = document.getElementById("email");
        const identity = document.getElementById("identity");
        const password = document.getElementById("password");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        let registering = false;

        document.getElementById("switchButton").addEventListener("click", () => {
            registering = !registering;
            usernameField.classList.toggle("hidden", !registering);
            emailField.classList.toggle("hidden", !registering);
            identityField.classList.toggle("hidden", registering);

            username.required = registering;
            email.required = registering;
            identity.required = !registering;
            password.autocomplete = registering ? "new-password" : "current-password";

            document.getElementById("heading").textContent =
                registering ? "Create account" : "Welcome back";
            document.getElementById("subtitle").textContent =
                registering ? "Create your personal expense tracker." :
                              "Log in to track your daily spending.";
            document.getElementById("submitButton").textContent =
                registering ? "Register" : "Log in";
            document.getElementById("switchText").textContent =
                registering ? "Already have an account?" : "New here?";
            document.getElementById("switchButton").textContent =
                registering ? "Log in" : "Create account";

            message.textContent = "";
            form.reset();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";
            submitButton.disabled = true;

            const payload = registering
                ? {
                    username: username.value.trim(),
                    email: email.value.trim(),
                    password: password.value
                }
                : {
                    identity: identity.value.trim(),
                    password: password.value
                };

            try {
                const response = await fetch(
                    registering ? "/api/register" : "/api/login",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    }
                );

                const result = await response.json();
                if (!response.ok) {
                    message.textContent = result.error || "Something went wrong.";
                    return;
                }

                window.location.href = "/";
            } catch (error) {
                message.textContent = "Could not connect. Please try again.";
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
